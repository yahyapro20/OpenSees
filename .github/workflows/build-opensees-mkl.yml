name: Build OpenSees + OpenSeesSP (Intel MKL + MUMPS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Ubuntu 22.04 / Intel oneAPI 2026.0 / MKL / MUMPS 5.5.1
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

    # ============================================================
    # 1. Checkout
    # ============================================================

    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: yahyapro20/OpenSees
        ref: master


    # ============================================================
    # 2. Ubuntu dependencies
    # ============================================================

    - name: Install dependencies
      shell: bash
      run: |
        set -e

        sudo apt update

        sudo apt install -y \
          build-essential \
          gcc \
          g++ \
          gfortran \
          git \
          ninja-build \
          wget \
          curl \
          pkg-config \
          libhdf5-dev \
          tcl-dev \
          tk-dev \
          libeigen3-dev \
          zlib1g-dev \
          numactl \
          hwloc


    # ============================================================
    # 3. Intel oneAPI 2026.0
    # ============================================================

    - name: Install Intel oneAPI 2026.0
      shell: bash
      run: |
        set -e

        wget -qO- \
          https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/oneapi.gpg >/dev/null

        echo \
          "deb [signed-by=/usr/share/keyrings/oneapi.gpg] https://apt.repos.intel.com/oneapi all main" \
          | sudo tee /etc/apt/sources.list.d/oneapi.list

        sudo apt update

        sudo apt install -y \
          intel-oneapi-mkl-devel-2026.0 \
          intel-oneapi-compiler-fortran-2026.0 \
          intel-oneapi-mpi-devel


    # ============================================================
    # 4. Verify Intel environment
    # ============================================================

    - name: Verify Intel oneAPI environment
      shell: bash
      run: |
        set -e

        source /opt/intel/oneapi/setvars.sh --force

        echo "========================================"
        echo "Intel oneAPI environment"
        echo "========================================"

        echo "MKLROOT=$MKLROOT"
        echo "I_MPI_ROOT=$I_MPI_ROOT"

        echo ""
        echo "ifx:"
        which ifx
        ifx --version

        echo ""
        echo "MPI:"
        which mpirun
        mpirun --version

        echo ""
        echo "MPI Fortran:"
        which mpiifx

        echo ""
        echo "MKL:"
        ls -ld "$MKLROOT"

        test "$MKLROOT" = "/opt/intel/oneapi/mkl/2026.0"
        test -x "$(which ifx)"
        test -n "$I_MPI_ROOT"

        echo ""
        echo "Intel environment verified."

        echo "MKLROOT=$MKLROOT" >> "$GITHUB_ENV"
        echo "I_MPI_ROOT=$I_MPI_ROOT" >> "$GITHUB_ENV"


    # ============================================================
    # 5. CMake / Ninja
    # ============================================================

    - name: Verify build tools
      shell: bash
      run: |
        set -e

        echo "CMake:"
        cmake --version

        echo ""
        echo "Ninja:"
        ninja --version


    # ============================================================
    # 6. Build MUMPS 5.5.1
    #
    # IMPORTANT:
    # - Intel ifx
    # - Intel MPI
    # - ScaLAPACK ON
    # - OpenMP ON
    # - tests are not built
    #
    # We build only the libraries OpenSees needs.
    # ============================================================

    - name: Build MUMPS 5.5.1
      shell: bash
      run: |
        set -e

        source /opt/intel/oneapi/setvars.sh --force

        rm -rf "$HOME/mumps-src"
        rm -rf "$HOME/mumps-build"
        rm -rf "$HOME/mumps-install"

        git clone --depth 1 \
          https://github.com/scivision/mumps.git \
          "$HOME/mumps-src"

        cmake \
          -S "$HOME/mumps-src" \
          -B "$HOME/mumps-build" \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_Fortran_COMPILER=ifx \
          -DMUMPS_UPSTREAM_VERSION=5.5.1 \
          -DMUMPS_parallel=ON \
          -DMUMPS_scalapack=ON \
          -DMUMPS_openmp=ON \
          -DMUMPS_intsize64=OFF \
          -DBUILD_SINGLE=ON \
          -DBUILD_DOUBLE=ON \
          -DBUILD_COMPLEX=OFF \
          -DBUILD_COMPLEX16=OFF \
          -DCMAKE_INSTALL_PREFIX="$HOME/mumps-install"

        echo ""
        echo "========================================"
        echo "MUMPS configured"
        echo "========================================"

        cmake --build "$HOME/mumps-build" \
          --target dmumps smumps mumps_common pord \
          --parallel 4

        cmake --install "$HOME/mumps-build"


    # ============================================================
    # 7. Verify MUMPS libraries
    # ============================================================

    - name: Verify MUMPS installation
      shell: bash
      run: |
        set -e

        echo "========================================"
        echo "Searching MUMPS libraries"
        echo "========================================"

        find "$HOME/mumps-install" \
          -type f \
          \( \
            -name "libdmumps.a" -o \
            -name "libsmumps.a" -o \
            -name "libmumps_common.a" -o \
            -name "libpord.a" \
          \) \
          -print | sort

        MUMPS_LIB_DIR="$(
          find "$HOME/mumps-install" \
            -type f \
            -name "libdmumps.a" \
            -printf "%h\n" \
            | head -n 1
        )"

        if [ -z "$MUMPS_LIB_DIR" ]; then
          echo ""
          echo "ERROR: libdmumps.a not found."
          exit 1
        fi

        echo ""
        echo "MUMPS_LIB_DIR=$MUMPS_LIB_DIR"

        for lib in \
          libdmumps.a \
          libsmumps.a \
          libmumps_common.a \
          libpord.a
        do
          if [ ! -f "$MUMPS_LIB_DIR/$lib" ]; then
            echo "ERROR: Missing $lib"
            exit 1
          fi

          echo "FOUND: $MUMPS_LIB_DIR/$lib"
        done

        echo ""

        echo "MUMPS_DIR=$MUMPS_LIB_DIR" >> "$GITHUB_ENV"


    # ============================================================
    # 8. Verify MUMPS has ScaLAPACK / BLACS symbols
    #
    # This is directly relevant to the previous undefined-reference
    # error:
    #
    # blacs_gridinfo_
    # numroc_
    # descinit_
    # pdpotrf_
    # pdgetrf_
    # ============================================================

    - name: Verify MUMPS ScaLAPACK linkage
      shell: bash
      run: |
        set -e

        echo "========================================"
        echo "Checking MUMPS ScaLAPACK symbols"
        echo "========================================"

        nm "$MUMPS_DIR/libdmumps.a" \
          | grep -E \
            "blacs_gridinfo_|numroc_|descinit_|pdpotrf_|pdgetrf_|pdpotrs_|pdgetrs_" \
          | head -20 || true

        echo ""
        echo "Checking Intel MKL ScaLAPACK / BLACS libraries..."

        find "$MKLROOT" \
          -type f \
          \( \
            -name "libmkl_scalapack*" -o \
            -name "libmkl_blacs*" \
          \) \
          -print | sort

        test -n "$(
          find "$MKLROOT" \
            -type f \
            -name "libmkl_scalapack*" \
            | head -n 1
        )"

        test -n "$(
          find "$MKLROOT" \
            -type f \
            -name "libmkl_blacs*" \
            | head -n 1
        )"

        echo ""
        echo "MUMPS ScaLAPACK dependencies are present."


    # ============================================================
    # 9. Configure OpenSees
    # ============================================================

    - name: Configure OpenSees
      shell: bash
      run: |
        set -e

        source /opt/intel/oneapi/setvars.sh --force

        rm -rf build

        mkdir build
        cd build

        echo "========================================"
        echo "OpenSees configure"
        echo "========================================"

        echo "MKLROOT=$MKLROOT"
        echo "MUMPS_DIR=$MUMPS_DIR"

        echo ""
        echo "MUMPS libraries:"
        ls -lh "$MUMPS_DIR"/libdmumps.a
        ls -lh "$MUMPS_DIR"/libsmumps.a
        ls -lh "$MUMPS_DIR"/libmumps_common.a
        ls -lh "$MUMPS_DIR"/libpord.a

        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_Fortran_COMPILER=ifx \
          -DCMAKE_C_FLAGS="-O3 -mavx2 -mfma" \
          -DCMAKE_CXX_FLAGS="-O3 -mavx2 -mfma" \
          -DCMAKE_Fortran_FLAGS="-O3 -mavx2 -mfma" \
          -DBLA_VENDOR=Intel10_64lp \
          -DBLA_STATIC=ON \
          -DMKL_LINK=static \
          -DMKL_INTERFACE_FULL=intel_lp64 \
          -DMUMPS_DIR="$MUMPS_DIR" \
          -DPARALLEL=1 \
          -DCMAKE_INSTALL_PREFIX="$HOME/opensees-install"


    # ============================================================
    # 10. HARD CHECK — CMake must use Intel MKL
    # ============================================================

    - name: Verify MKL CMake configuration
      shell: bash
      run: |
        set -e

        cd build

        echo "========================================"
        echo "BLAS / LAPACK / MKL configuration"
        echo "========================================"

        grep -Ei \
          "BLAS|LAPACK|MKL|SCALAPACK|BLACS" \
          CMakeCache.txt \
          || true

        echo ""
        echo "========================================"
        echo "Searching CMake files for Ubuntu Netlib"
        echo "========================================"

        if grep -R -Eqi \
          "/usr/lib/x86_64-linux-gnu/libblas|/usr/lib/x86_64-linux-gnu/liblapack" \
          . \
          --include='CMakeCache.txt' \
          --include='*.cmake'
        then
          echo ""
          echo "ERROR:"
          echo "Ubuntu Netlib BLAS/LAPACK detected."
          echo "MKL verification FAILED."
          exit 1
        fi

        echo ""
        echo "No Ubuntu Netlib BLAS/LAPACK detected."

        echo ""
        echo "========================================"
        echo "Checking MKL 2026.0"
        echo "========================================"

        grep -F \
          "/opt/intel/oneapi/mkl/2026.0" \
          CMakeCache.txt \
          >/dev/null

        echo "Intel MKL 2026.0 detected."

        echo ""
        echo "MKL configuration verified."


    # ============================================================
    # 11. Build OpenSees
    # ============================================================

    - name: Build OpenSees
      shell: bash
      run: |
        set -e

        source /opt/intel/oneapi/setvars.sh --force

        cd build

        cmake --build . \
          --target OpenSees \
          --parallel 4


    # ============================================================
    # 12. Build OpenSeesSP
    # ============================================================

    - name: Build OpenSeesSP
      shell: bash
      run: |
        set -e

        source /opt/intel/oneapi/setvars.sh --force

        cd build

        cmake --build . \
          --target OpenSeesSP \
          --parallel 4


    # ============================================================
    # 13. HARD CHECK — MKL in final binaries
    # ============================================================

    - name: Verify MKL in final binaries
      shell: bash
      run: |
        set -e

        cd build

        for exe in OpenSees OpenSeesSP
        do
          echo ""
          echo "========================================"
          echo "Checking $exe"
          echo "========================================"

          test -x "./$exe"

          echo ""
          echo "MKL signature:"

          if strings "./$exe" | grep -i \
            "Math Kernel Library"
          then
            echo ""
            echo "MKL signature found in $exe."
          else
            echo ""
            echo "ERROR:"
            echo "Intel MKL signature NOT found in $exe."
            exit 1
          fi
        done

        echo ""
        echo "Final MKL binary verification PASSED."


    # ============================================================
    # 14. Runtime OpenSees
    # ============================================================

    - name: Runtime OpenSees test
      shell: bash
      run: |
        set -e

        cd build

        echo 'puts {OpenSees OK}; exit' \
          | ./OpenSees


    # ============================================================
    # 15. Runtime OpenSeesSP + MUMPS
    # ============================================================

    - name: Runtime OpenSeesSP MUMPS test
      shell: bash
      run: |
        set -e

        source /opt/intel/oneapi/setvars.sh --force

        cd build

        cat > /tmp/test_mumps.tcl <<'EOF'
        system Mumps
        puts {MUMPS OK}
        exit
        EOF

        mpirun \
          --allow-run-as-root \
          -np 2 \
          ./OpenSeesSP \
          /tmp/test_mumps.tcl


    # ============================================================
    # 16. Package
    # ============================================================

    - name: Package binaries
      shell: bash
      run: |
        set -e

        rm -rf artifact

        mkdir -p artifact

        cp build/OpenSees \
          artifact/

        cp build/OpenSeesSP \
          artifact/

        tar czf \
          OpenSees-MKL-MUMPS.tar.gz \
          artifact


    # ============================================================
    # 17. Upload
    # ============================================================

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenSees-MKL-MUMPS
        path: OpenSees-MKL-MUMPS.tar.gz
