name: Build OpenSees + OpenSeesSP - Windows - MKL - MUMPS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ONEAPI_ROOT: C:\Program Files (x86)\Intel\oneAPI
  MUMPS_VERSION: 5.5.1
  MUMPS_DIR: ${{ github.workspace }}\mumps
  BUILD_ROOT: ${{ github.workspace }}\build-windows

jobs:

  build:
    name: Windows 2022 / oneAPI 2026.0 / OpenSees + OpenSeesSP
    runs-on: windows-2022
    timeout-minutes: 180

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout OpenSees
        uses: actions/checkout@v4
        with:
          repository: yahyapro20/OpenSees
          ref: master
          fetch-depth: 1


      # ============================================================
      # 2. Visual Studio 2022
      # ============================================================

      - name: Setup Visual Studio 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      # ============================================================
      # 3. Install Intel oneAPI 2026.0
      #
      # oneAPI 2026 unified Base + HPC toolkit.
      #
      # Components:
      #   MKL
      #   Intel MPI
      #   Intel Fortran / ifx
      #   Intel C++ / icx
      # ============================================================

      - name: Install Intel oneAPI 2026.0
        shell: pwsh
        env:
          ONEAPI_INSTALLER_URL: >-
            https://registrationcenter-download.intel.com/akdlm/IRC_NAS/bae85ab1-cfcd-4251-8d42-a0c27949ea33/intel-oneapi-toolkit-2026.0.0.193_offline.exe
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:RUNNER_TEMP\intel-oneapi-2026.0.exe"

          Write-Host "Downloading Intel oneAPI 2026.0..."
          curl.exe `
            -L `
            --retry 5 `
            --retry-delay 5 `
            -o $installer `
            $env:ONEAPI_INSTALLER_URL

          if (!(Test-Path $installer)) {
            throw "Intel oneAPI installer was not downloaded."
          }

          Write-Host "Installing Intel oneAPI 2026.0..."

          $args = @(
            "-s",
            "-a",
            "--silent",
            "--eula", "accept",
            "-p=NEED_VS2022_INTEGRATION=0"
          )

          $p = Start-Process `
            -FilePath $installer `
            -ArgumentList $args `
            -Wait `
            -PassThru

          if ($p.ExitCode -ne 0) {
            throw "Intel oneAPI installation failed with exit code $($p.ExitCode)"
          }

          if (!(Test-Path "$env:ONEAPI_ROOT\setvars.bat")) {
            throw "Intel oneAPI installation completed but setvars.bat was not found."
          }


      # ============================================================
      # 4. Activate / verify Intel environment
      # ============================================================

      - name: Verify Intel oneAPI 2026.0
        shell: cmd
        run: |
          call "%ONEAPI_ROOT%\setvars.bat" intel64 mod

          echo ============================================================
          echo Intel oneAPI
          echo ============================================================

          where icx
          icx --version

          echo.
          where ifx
          ifx --version

          echo.
          where mpiicx
          mpiicx -show

          echo.
          where mpiifx
          mpiifx -show

          echo.
          where mpiexec
          mpiexec -version

          echo.
          echo MKLROOT=%MKLROOT%
          echo I_MPI_ROOT=%I_MPI_ROOT%

          if not exist "%MKLROOT%" (
            echo ERROR: MKLROOT does not exist.
            exit /b 1
          )

          if not exist "%I_MPI_ROOT%" (
            echo ERROR: I_MPI_ROOT does not exist.
            exit /b 1
          )
      - name: Verify MKL LP64 ScaLAPACK and BLACS
        shell: cmd
        run: |
          call "%ONEAPI_ROOT%\setvars.bat" intel64 mod

          echo ============================================================
          echo MKL libraries
          echo ============================================================

          echo MKLROOT=%MKLROOT%

          if exist "%MKLROOT%\lib\intel64\mkl_scalapack_lp64.lib" (
          echo FOUND:
          echo %MKLROOT%\lib\intel64\mkl_scalapack_lp64.lib
          ) else (
          echo ERROR: mkl_scalapack_lp64.lib not found
          exit /b 1
           )

      - name: Verify MKL LP64 ScaLAPACK and BLACS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "MKL libraries"
          Write-Host "============================================================"

          Write-Host "MKLROOT = $env:MKLROOT"

          if ([string]::IsNullOrWhiteSpace($env:MKLROOT)) {
            throw "MKLROOT is not defined."
          }

          $mklLib = Join-Path $env:MKLROOT "lib\intel64"

          Write-Host "MKL library directory:"
          Write-Host $mklLib

          if (!(Test-Path $mklLib)) {
            throw "MKL library directory does not exist: $mklLib"
          }

          $required = @(
            "mkl_scalapack_lp64.lib",
            "mkl_blacs_intelmpi_lp64.lib",
            "mkl_intel_lp64.lib",
            "mkl_sequential.lib",
            "mkl_core.lib"
          )

          foreach ($lib in $required) {

            $path = Join-Path $mklLib $lib

            if (Test-Path $path) {
              Write-Host "FOUND: $path"
            }
            else {
              throw "ERROR: Required MKL library not found: $path"
            }
          }

          Write-Host ""
          Write-Host "MKL LP64 verification PASSED."

      # ============================================================
      # 6. Install Conan
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Conan
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install conan
          conan --version
          conan profile detect --force


      # ============================================================
      # 7. Install OpenSees third-party dependencies
      #
      # Uses the existing OpenSees Conan configuration.
      # ============================================================

      - name: Install Conan dependencies
        shell: cmd
        run: |
          set CMAKE_POLICY_VERSION_MINIMUM=3.5

          conan install . ^
            -s arch=x86_64 ^
            -s compiler.runtime=static ^
            --build=missing ^
            -c tools.cmake.cmaketoolchain:generator=Ninja


      # ============================================================
      # 8. Clone MUMPS 5.5.1
      # ============================================================

      - name: Clone MUMPS
        shell: cmd
        run: |
          if exist "%MUMPS_DIR%" (
            rmdir /s /q "%MUMPS_DIR%"
          )

          git clone ^
            --depth 1 ^
            --branch master ^
            https://github.com/OpenSees/mumps.git ^
            "%MUMPS_DIR%"


      # ============================================================
      # 9. Configure MUMPS
      #
      # MUMPS is built once and reused by both Release and Profile.
      #
      # OpenSees uses the real/double MUMPS path.
      # ============================================================

      - name: Configure MUMPS
        shell: cmd
        run: |
          call "%ONEAPI_ROOT%\setvars.bat" intel64 mod

          cd /d "%MUMPS_DIR%"

          cmake ^
            -S . ^
            -B build ^
            -G Ninja ^
            -Darith=d ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_Fortran_COMPILER=ifx ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DCMAKE_Fortran_FLAGS="/libs:static" ^
            -DCMAKE_EXE_LINKER_FLAGS="/FORCE:MULTIPLE" ^
            -DCMAKE_SHARED_LINKER_FLAGS="/FORCE:MULTIPLE"


      # ============================================================
      # 10. Build MUMPS
      # ============================================================

      - name: Build MUMPS
        shell: cmd
        run: |
          call "%ONEAPI_ROOT%\setvars.bat" intel64 mod

          cmake ^
            --build "%MUMPS_DIR%\build" ^
            --config Release ^
            --parallel 8


      # ============================================================
      # 11. Verify MUMPS libraries
      # ============================================================

      - name: Verify MUMPS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $mumpsBuild = "$env:MUMPS_DIR\build"

          Write-Host "Searching MUMPS libraries..."

          $required = @(
            "dmumps.lib",
            "mumps_common.lib",
            "pord.lib"
          )

          foreach ($lib in $required) {

            $found = Get-ChildItem `
              -Path $mumpsBuild `
              -Recurse `
              -Filter $lib `
              -File `
              -ErrorAction SilentlyContinue

            if (!$found) {
              throw "Required MUMPS library not found: $lib"
            }

            Write-Host "FOUND $lib"
            $found | ForEach-Object {
              Write-Host $_.FullName
            }
          }


      # ============================================================
      # 12. Determine MUMPS library directory
      # ============================================================

      - name: Set MUMPS library directory
        shell: pwsh
        run: |
          $dmumps = Get-ChildItem `
            -Path "$env:MUMPS_DIR\build" `
            -Recurse `
            -Filter dmumps.lib `
            -File `
            | Select-Object -First 1

          if (!$dmumps) {
            throw "dmumps.lib was not found."
          }

          $dir = $dmumps.Directory.FullName

          Write-Host "MUMPS_LIBDIR=$dir"

          "MUMPS_LIBDIR=$dir" >> $env:GITHUB_ENV


      # ============================================================
      # 13. Prepare build directories
      # ============================================================

      - name: Prepare build directories
        shell: pwsh
        run: |
          Remove-Item "$env:BUILD_ROOT" -Recurse -Force -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$env:BUILD_ROOT\Release" `
            | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$env:BUILD_ROOT\Profile" `
            | Out-Null


      # ============================================================
      # 14. Configure RELEASE
      #
      # Target CPU:
      #   Intel Raptor Lake / i9-13900K
      #
      # /QxCORE-AVX2 is used instead of /QxHost because GitHub
      # runner CPU must not determine the binary target.
      # ============================================================

      - name: Configure Release
        shell: cmd
        run: |
          call "%ONEAPI_ROOT%\setvars.bat" intel64 mod

          cmake ^
            -S . ^
            -B "%BUILD_ROOT%\Release" ^
            -G Ninja ^
            -DCMAKE_TOOLCHAIN_FILE="%BUILD_ROOT%\..\build\Release\generators\conan_toolchain.cmake" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=icx ^
            -DCMAKE_CXX_COMPILER=icx ^
            -DCMAKE_Fortran_COMPILER=ifx ^
            -DCMAKE_C_FLAGS="/O3 /QxCORE-AVX2 /fp:fast" ^
            -DCMAKE_CXX_FLAGS="/O3 /QxCORE-AVX2 /fp:fast" ^
            -DCMAKE_Fortran_FLAGS="/O3 /QxCORE-AVX2 /fp:fast" ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DBLA_VENDOR=Intel10_64lp ^
            -DBLA_STATIC=ON ^
            -DMKL_LINK=static ^
            -DMKL_INTERFACE_FULL=intel_lp64 ^
            -DMKL_THREADING=sequential ^
            -DMUMPS_DIR="%MUMPS_LIBDIR%" ^
            -DPARALLEL=1 ^
            -DSCALAPACK_LIBRARIES="%MKLROOT%\lib\intel64\mkl_scalapack_lp64.lib;%MKLROOT%\lib\intel64\mkl_blacs_intelmpi_lp64.lib" ^
            -DCMAKE_EXE_LINKER_FLAGS="/FORCE:MULTIPLE" ^
            -DCMAKE_SHARED_LINKER_FLAGS="/FORCE:MULTIPLE" ^
            -DCMAKE_NINJA_FORCE_RESPONSE_FILE=ON


      # ============================================================
      # 15. HARD GATE - Release configuration
      # ============================================================

      - name: Verify Release configuration
        shell: pwsh
        run: |
          $cache = "$env:BUILD_ROOT\Release\CMakeCache.txt"

          if (!(Test-Path $cache)) {
            throw "Release CMakeCache.txt not found."
          }

          $text = Get-Content $cache -Raw

          if ($text -notmatch "mkl_scalapack_lp64\.lib") {
            throw "Release build is NOT using MKL LP64 ScaLAPACK."
          }

          if ($text -notmatch "mkl_blacs_intelmpi_lp64\.lib") {
            throw "Release build is NOT using Intel MPI LP64 BLACS."
          }

          if ($text -notmatch "MUMPS_DIR") {
            throw "MUMPS_DIR is missing from Release configuration."
          }

          Write-Host "Release configuration passed."


      # ============================================================
      # 16. Build OpenSees Release
      # ============================================================

      - name: Build OpenSees Release
        shell: cmd
        run: |
          call "%ONEAPI_ROOT%\setvars.bat" intel64 mod

          cmake ^
            --build "%BUILD_ROOT%\Release" ^
            --config Release ^
            --target OpenSees ^
            --parallel 8


      # ============================================================
      # 17. Build OpenSeesSP Release
      # ============================================================

      - name: Build OpenSeesSP Release
        shell: cmd
        run: |
          call "%ONEAPI_ROOT%\setvars.bat" intel64 mod

          cmake ^
            --build "%BUILD_ROOT%\Release" ^
            --config Release ^
            --target OpenSeesSP ^
            --parallel 8


      # ============================================================
      # 18. Verify Release executables
      # ============================================================

      - name: Verify Release binaries
        shell: pwsh
        run: |
          $required = @(
            "$env:BUILD_ROOT\Release\OpenSees.exe",
            "$env:BUILD_ROOT\Release\OpenSeesSP.exe"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Missing Release binary: $file"
            }

            Write-Host "FOUND: $file"
          }


      # ============================================================
      # 19. Configure PROFILE
      #
      # VTune-friendly:
      #   - debug symbols
      #   - frame pointers
      #   - optimization retained
      #
      # No /QxHost.
      # ============================================================

      - name: Configure Profile
        shell: cmd
        run: |
          call "%ONEAPI_ROOT%\setvars.bat" intel64 mod

          cmake ^
            -S . ^
            -B "%BUILD_ROOT%\Profile" ^
            -G Ninja ^
            -DCMAKE_TOOLCHAIN_FILE="%BUILD_ROOT%\..\build\Release\generators\conan_toolchain.cmake" ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DCMAKE_C_COMPILER=icx ^
            -DCMAKE_CXX_COMPILER=icx ^
            -DCMAKE_Fortran_COMPILER=ifx ^
            -DCMAKE_C_FLAGS="/O2 /Zi /Oy- /QxCORE-AVX2 /fp:fast" ^
            -DCMAKE_CXX_FLAGS="/O2 /Zi /Oy- /QxCORE-AVX2 /fp:fast" ^
            -DCMAKE_Fortran_FLAGS="/O2 /debug:full /QxCORE-AVX2 /fp:fast" ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DBLA_VENDOR=Intel10_64lp ^
            -DBLA_STATIC=ON ^
            -DMKL_LINK=static ^
            -DMKL_INTERFACE_FULL=intel_lp64 ^
            -DMKL_THREADING=sequential ^
            -DMUMPS_DIR="%MUMPS_LIBDIR%" ^
            -DPARALLEL=1 ^
            -DSCALAPACK_LIBRARIES="%MKLROOT%\lib\intel64\mkl_scalapack_lp64.lib;%MKLROOT%\lib\intel64\mkl_blacs_intelmpi_lp64.lib" ^
            -DCMAKE_EXE_LINKER_FLAGS="/FORCE:MULTIPLE" ^
            -DCMAKE_SHARED_LINKER_FLAGS="/FORCE:MULTIPLE" ^
            -DCMAKE_NINJA_FORCE_RESPONSE_FILE=ON


      # ============================================================
      # 20. HARD GATE - Profile configuration
      # ============================================================

      - name: Verify Profile configuration
        shell: pwsh
        run: |
          $cache = "$env:BUILD_ROOT\Profile\CMakeCache.txt"

          if (!(Test-Path $cache)) {
            throw "Profile CMakeCache.txt not found."
          }

          $text = Get-Content $cache -Raw

          if ($text -notmatch "mkl_scalapack_lp64\.lib") {
            throw "Profile build is NOT using MKL LP64 ScaLAPACK."
          }

          if ($text -notmatch "mkl_blacs_intelmpi_lp64\.lib") {
            throw "Profile build is NOT using Intel MPI LP64 BLACS."
          }

          Write-Host "Profile configuration passed."


      # ============================================================
      # 21. Build OpenSees Profile
      # ============================================================

      - name: Build OpenSees Profile
        shell: cmd
        run: |
          call "%ONEAPI_ROOT%\setvars.bat" intel64 mod

          cmake ^
            --build "%BUILD_ROOT%\Profile" ^
            --config RelWithDebInfo ^
            --target OpenSees ^
            --parallel 8


      # ============================================================
      # 22. Build OpenSeesSP Profile
      # ============================================================

      - name: Build OpenSeesSP Profile
        shell: cmd
        run: |
          call "%ONEAPI_ROOT%\setvars.bat" intel64 mod

          cmake ^
            --build "%BUILD_ROOT%\Profile" ^
            --config RelWithDebInfo ^
            --target OpenSeesSP ^
            --parallel 8


      # ============================================================
      # 23. Verify Profile binaries
      # ============================================================

      - name: Verify Profile binaries
        shell: pwsh
        run: |
          $required = @(
            "$env:BUILD_ROOT\Profile\OpenSees.exe",
            "$env:BUILD_ROOT\Profile\OpenSeesSP.exe"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Missing Profile binary: $file"
            }

            Write-Host "FOUND: $file"
          }


      # ============================================================
      # 24. Collect Intel runtime DLLs
      # ============================================================

      - name: Collect runtime
        shell: pwsh
        run: |
          $runtime = "$env:BUILD_ROOT\runtime"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $runtime `
            | Out-Null

          $paths = @(
            "$env:ONEAPI_ROOT\compiler\2026.0\bin",
            "$env:ONEAPI_ROOT\mkl\2026.0\bin",
            "$env:ONEAPI_ROOT\mpi\2021.18\bin"
          )

          foreach ($dir in $paths) {

            if (Test-Path $dir) {

              Get-ChildItem `
                -Path $dir `
                -Filter *.dll `
                -File `
                | Copy-Item -Destination $runtime -Force

            }
          }

          Write-Host "Runtime files:"
          Get-ChildItem $runtime


      # ============================================================
      # 25. Package Release
      # ============================================================

      - name: Package Release
        shell: pwsh
        run: |
          $out = "$env:BUILD_ROOT\package\Release"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $out `
            | Out-Null

          Copy-Item `
            "$env:BUILD_ROOT\Release\OpenSees.exe" `
            $out

          Copy-Item `
            "$env:BUILD_ROOT\Release\OpenSeesSP.exe" `
            $out

          Copy-Item `
            "$env:BUILD_ROOT\runtime\*.dll" `
            $out `
            -ErrorAction SilentlyContinue


      # ============================================================
      # 26. Package Profile
      # ============================================================

      - name: Package Profile
        shell: pwsh
        run: |
          $out = "$env:BUILD_ROOT\package\Profile"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $out `
            | Out-Null

          Copy-Item `
            "$env:BUILD_ROOT\Profile\OpenSees.exe" `
            $out

          Copy-Item `
            "$env:BUILD_ROOT\Profile\OpenSeesSP.exe" `
            $out

          Copy-Item `
            "$env:BUILD_ROOT\runtime\*.dll" `
            $out `
            -ErrorAction SilentlyContinue


      # ============================================================
      # 27. Upload artifacts
      # ============================================================

      - name: Upload Release
        uses: actions/upload-artifact@v4
        with:
          name: OpenSees-Windows-Release-oneAPI-2026.0
          path: |
            build-windows/package/Release/**
          if-no-files-found: error


      - name: Upload Profile
        uses: actions/upload-artifact@v4
        with:
          name: OpenSees-Windows-Profile-oneAPI-2026.0
          path: |
            build-windows/package/Profile/**
          if-no-files-found: error
