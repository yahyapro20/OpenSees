name: Qwen Build OpenSees Windows (Release + Profile + SP)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MUMPS_INSTALL: ${{ github.workspace }}/mumps-install
  OPENSEES_BUILD: ${{ github.workspace }}/build

jobs:
  build-windows:
    name: OpenSees ${{ matrix.build_type }} / Windows MSVC + oneAPI
    runs-on: windows-2022
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            cmake_cfg: Release
            c_flags: "/MD /O2 /Ob2 /arch:AVX2 /DNDEBUG"
            cxx_flags: "/MD /O2 /Ob2 /arch:AVX2 /DNDEBUG"
            f_flags: "/MD /O2 /QxCORE-AVX2"
          - build_type: Profile
            cmake_cfg: RelWithDebInfo
            c_flags: "/MD /Zi /O2 /Ob1 /Oy- /arch:AVX2 /DNDEBUG"
            cxx_flags: "/MD /Zi /O2 /Ob1 /Oy- /arch:AVX2 /DNDEBUG"
            f_flags: "/MD /Zi /O2 /QxCORE-AVX2"

    steps:

      # ============================================================
      # 1. Checkout OpenSees
      # ============================================================
      - name: Checkout OpenSees
        uses: actions/checkout@v4
        with:
          repository: yahyapro20/OpenSees
          ref: master
          fetch-depth: 1

      # ============================================================
      # 2. vcpkg + Dependencies (Self-Healing Tcl/Tk)
      # ============================================================
      - name: Setup vcpkg and Install Dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot -or -not (Test-Path (Join-Path $vcpkgRoot "vcpkg.exe"))) {
            Write-Host "vcpkg not pre-installed -> bootstrapping via cmd..."
            $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
            cmd /c "git clone --depth 1 https://github.com/microsoft/vcpkg.git `"$vcpkgRoot`" 2>&1"
            cmd /c "`"$vcpkgRoot\bootstrap-vcpkg.bat`" -disableMetrics 2>&1"
            if ($LASTEXITCODE -ne 0) { Write-Host "ERROR: vcpkg bootstrap failed"; exit 1 }
          }
          $vcpkgExe = Join-Path $vcpkgRoot "vcpkg.exe"
          $vcpkgSlash = $vcpkgRoot -replace '\\','/'
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_USED=$vcpkgSlash"
          & $vcpkgExe version

          foreach ($pkg in @("zlib:x64-windows", "tcl:x64-windows", "eigen3:x64-windows", "hdf5:x64-windows")) {
            Write-Host ">>> Installing: $pkg"
            & $vcpkgExe install $pkg 2>&1 | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -ne 0) { Write-Host "ERROR: vcpkg install $pkg failed"; exit 1 }
          }

          $inst = Join-Path $vcpkgRoot "installed\x64-windows"
          $tkLib  = Get-ChildItem -Path (Join-Path $inst "lib") -Filter "tk*.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          $tkHdr  = Get-ChildItem -Path (Join-Path $inst "include") -Recurse -Filter "tk.h" -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($tkLib -and $tkHdr) {
            Write-Host "vcpkg tcl port ships Tk -> using vcpkg paths."
            $tclLib = Get-ChildItem -Path (Join-Path $inst "lib") -Filter "tcl*.lib" | Select-Object -First 1
            $tclHdr = Get-ChildItem -Path (Join-Path $inst "include") -Recurse -Filter "tcl.h" | Select-Object -First 1
            Add-Content -Path $env:GITHUB_ENV -Value "TCL_LIBRARY_HINT=$($tclLib.FullName -replace '\\','/')"
            Add-Content -Path $env:GITHUB_ENV -Value "TK_LIBRARY_HINT=$($tkLib.FullName -replace '\\','/')"
            Add-Content -Path $env:GITHUB_ENV -Value "TCLTK_INCLUDE_HINT=$($tclHdr.DirectoryName -replace '\\','/')"
            Add-Content -Path $env:GITHUB_ENV -Value "TCLTK_BIN_DIR=$($inst -replace '\\','/')/bin"
          } else {
            Write-Host "Tk missing -> building Tcl/Tk from source (nmake/MSVC)..."
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vcvars = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find "VC\Auxiliary\Build\vcvars64.bat" | Select-Object -First 1
            $tcltkDir = "C:\tcltk"
            $tcltkSlash = $tcltkDir -replace '\\','/'

            cmd /c "git clone --depth 1 --branch core-9-0-3 https://github.com/tcltk/tcl.git C:\srctcl 2>&1"
            cmd /c "git clone --depth 1 --branch core-9-0-3 https://github.com/tcltk/tk.git C:\srctk 2>&1"

            cmd /c "`"$vcvars`" && cd /d C:\srctcl\win && nmake -f makefile.vc RELEASE=1 OPTS=threads 2>&1"
            if ($LASTEXITCODE -ne 0) { Write-Host "ERROR: nmake tcl failed"; exit 1 }
            cmd /c "`"$vcvars`" && cd /d C:\srctcl\win && nmake -f makefile.vc install INSTALLDIR=$tcltkDir 2>&1"

            cmd /c "`"$vcvars`" && cd /d C:\srctk\win && nmake -f makefile.vc RELEASE=1 OPTS=threads TCLDIR=C:\srctcl 2>&1"
            if ($LASTEXITCODE -ne 0) { Write-Host "ERROR: nmake tk failed"; exit 1 }
            cmd /c "`"$vcvars`" && cd /d C:\srctk\win && nmake -f makefile.vc install INSTALLDIR=$tcltkDir 2>&1"

            # import lib درست: tcl90.lib و tcl9tk90.lib (نه stub)
            $tclLib = Get-ChildItem "$tcltkDir\lib" -Filter "tcl90.lib" | Select-Object -First 1
            if (-not $tclLib) { $tclLib = Get-ChildItem "$tcltkDir\lib" -Filter "tcl*.lib" | Where-Object { $_.Name -notmatch 'stub' } | Select-Object -First 1 }
            $tkLib2 = Get-ChildItem "$tcltkDir\lib" -Filter "tcl9tk*.lib" | Select-Object -First 1
            if (-not $tkLib2) { $tkLib2 = Get-ChildItem "$tcltkDir\lib" -Filter "tk*.lib" | Where-Object { $_.Name -notmatch 'stub' } | Select-Object -First 1 }
            Write-Host "TCL lib: $($tclLib.FullName) | TK lib: $($tkLib2.FullName)"
            Add-Content -Path $env:GITHUB_ENV -Value "TCL_LIBRARY_HINT=$($tclLib.FullName -replace '\\','/')"
            Add-Content -Path $env:GITHUB_ENV -Value "TK_LIBRARY_HINT=$($tkLib2.FullName -replace '\\','/')"
            Add-Content -Path $env:GITHUB_ENV -Value "TCLTK_INCLUDE_HINT=$tcltkSlash/include"
            Add-Content -Path $env:GITHUB_ENV -Value "TCLTK_BIN_DIR=$tcltkSlash/bin"
          }
          Write-Host "=== Dependencies step finished ==="

      # ============================================================
      # 3a. Download + Extract Intel oneAPI Toolkit
      # ============================================================
      - name: Download and Extract Intel oneAPI Toolkit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $workdir = $env:GITHUB_WORKSPACE
          $url = "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/4144bec3-82ce-4672-bd71-5c93a79cd5e7/intel-oneapi-toolkit-2026.1.0.191_offline.exe"

          Write-Host "Downloading Intel oneAPI Toolkit..."
          curl.exe --output "$workdir\webimage.exe" --url $url --retry 5 --retry-delay 5
          if ($LASTEXITCODE -ne 0) { Write-Host "ERROR: download failed"; exit 1 }

          Write-Host "Extracting bootstrapper..."
          cmd /c "cd /d $workdir && start /b /wait webimage.exe -s -x -f webimage_extracted --log extract.log"
          if (-not (Test-Path "$workdir\webimage_extracted\bootstrapper.exe")) {
            Write-Host "ERROR: extraction failed - bootstrapper.exe not found"
            Get-Content "$workdir\extract.log" -Tail 30 -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Extraction OK."

      # ============================================================
      # 3b. Silent install: MKL + ifx + MPI
      # ============================================================
      - name: Install Intel oneAPI (MKL + ifx + MPI) silent
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $workdir = $env:GITHUB_WORKSPACE
          $components = "intel.oneapi.win.mkl.devel:intel.oneapi.win.ifort-compiler:intel.oneapi.win.mpi.devel"

          cmd /c "cd /d $workdir && webimage_extracted\bootstrapper.exe -s --action install --components=$components --eula=accept -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0 --log-dir=$workdir 2>&1"
          Write-Host "bootstrapper exit code: $LASTEXITCODE"

          $setvars = "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
          if (-not (Test-Path $setvars)) {
            Write-Host "ERROR: setvars.bat not found after install"
            Get-ChildItem $workdir -Filter "bootstrapper*.log" | ForEach-Object {
              Write-Host "--- $($_.Name) (tail) ---"
              Get-Content $_.FullName -Tail 40
            }
            exit 1
          }
          Write-Host "oneAPI installed successfully."

      # ============================================================
      # 4. Activate and Export Intel Environment
      # ============================================================
      - name: Activate and Export Intel oneAPI Environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $setvars = "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
          $envVars = cmd /c "`"$setvars`" intel64 && set"
          foreach ($line in $envVars) {
            if ($line -match "^(.*?)=(.*)$") {
              [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2], "Process")
              Add-Content -Path $env:GITHUB_ENV -Value "$($matches[1])=$($matches[2])"
            }
          }
          Write-Host "MKLROOT = $env:MKLROOT"
          Write-Host "I_MPI_ROOT = $env:I_MPI_ROOT"
          ifx --version
          mpiexec -version

      # ============================================================
      # 5. Locate MKL static ScaLAPACK + BLACS (.lib)
      # ============================================================
      - name: Locate MKL static ScaLAPACK and BLACS
        shell: pwsh
        run: |
          $scalapack_lib = Get-ChildItem -Path $env:MKLROOT -Recurse -Filter "mkl_scalapack_lp64.lib" | Select-Object -First 1 -ExpandProperty FullName
          $blacs_lib = Get-ChildItem -Path $env:MKLROOT -Recurse -Filter "mkl_blacs_intelmpi_lp64.lib" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $scalapack_lib -or -not $blacs_lib) { Write-Host "ERROR: ScaLAPACK/BLACS .lib not found"; exit 1 }
          $scalapack_lib = $scalapack_lib -replace '\\','/'
          $blacs_lib = $blacs_lib -replace '\\','/'
          Write-Host "SCALAPACK_LIB=$scalapack_lib"
          Write-Host "BLACS_LIB=$blacs_lib"
          Add-Content -Path $env:GITHUB_ENV -Value "SCALAPACK_LIB=$scalapack_lib"
          Add-Content -Path $env:GITHUB_ENV -Value "BLACS_LIB=$blacs_lib"

      # ============================================================
      # 6. Build MUMPS 5.5.1 (Ninja + ifx full path)
      # ============================================================
      - name: Clone and Build MUMPS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          git clone --depth 1 https://github.com/scivision/mumps-superbuild.git 2>&1 | ForEach-Object { Write-Host $_ }

          $ifxPath = (Get-Command ifx -ErrorAction SilentlyContinue).Source
          if (-not $ifxPath) {
            $ifxPath = Get-ChildItem -Path "C:\Program Files (x86)\Intel\oneAPI" -Recurse -Filter "ifx.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $ifxPath) { Write-Host "ERROR: ifx.exe not found anywhere!"; exit 1 }
          $ifxPath = $ifxPath -replace '\\','/'
          Write-Host "Using Fortran compiler: $ifxPath"

          cmake -S mumps-superbuild -B mumps-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_NINJA_FORCE_RESPONSE_FILE=ON `
            -DCMAKE_INSTALL_PREFIX="$env:MUMPS_INSTALL" `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_Fortran_COMPILER="$ifxPath" `
            -DMUMPS_UPSTREAM_VERSION="5.5.1" `
            -DMUMPS_parallel=ON `
            -DMUMPS_scalapack=ON `
            -DMUMPS_openmp=ON `
            -DMUMPS_intsize64=OFF `
            -DMUMPS_BUILD_TESTING=OFF `
            -DBUILD_SINGLE=ON `
            -DBUILD_DOUBLE=ON `
            -DBUILD_COMPLEX=OFF `
            -DBUILD_COMPLEX16=OFF `
            -DBUILD_SHARED_LIBS=OFF `
            -DMUMPS_find_static=ON `
            -DMKL_THREADING=sequential
          if ($LASTEXITCODE -ne 0) { exit 1 }

          cmake --build mumps-build --parallel 2>&1 | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --install mumps-build
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $mumps_libdir = (Join-Path $env:MUMPS_INSTALL "lib") -replace '\\','/'
          if (-not (Test-Path "$mumps_libdir/dmumps.lib")) {
            Write-Host "ERROR: dmumps.lib not found in $mumps_libdir"
            Get-ChildItem $env:MUMPS_INSTALL -Recurse | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "MUMPS_LIBDIR=$mumps_libdir"
          Write-Host "MUMPS installed at $mumps_libdir"

      # ============================================================
      # 7. Configure OpenSees (Ninja + RESPONSE FILES fix)
      # ============================================================
      - name: Configure OpenSees
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          # --- Resolve the vcpkg root that ACTUALLY has installed packages ---
          $cands = @($env:VCPKG_USED, $env:VCPKG_ROOT, $env:VCPKG_INSTALLATION_ROOT, "C:/vcpkg")
          $toolchain = $null
          foreach ($c in $cands) {
            if ($c -and (Test-Path "$c/installed/x64-windows/include/tcl.h")) {
              $toolchain = "$c/scripts/buildsystems/vcpkg.cmake"
              break
            }
          }
          if (-not $toolchain) { Write-Host "ERROR: no vcpkg root with installed packages found!"; exit 1 }
          Write-Host "FORCING toolchain: $toolchain"

          # --- ifx full path ---
          $ifxPath = (Get-Command ifx -ErrorAction SilentlyContinue).Source
          if (-not $ifxPath) {
            $ifxPath = Get-ChildItem -Path "C:\Program Files (x86)\Intel\oneAPI" -Recurse -Filter "ifx.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $ifxPath) { Write-Host "ERROR: ifx.exe not found!"; exit 1 }
          $ifxPath = $ifxPath -replace '\\','/'
          Write-Host "Using Fortran compiler for OpenSees: $ifxPath"

          # --- Tcl/Tk hints ---
          $tcltkArgs = @()
          if ($env:TCL_LIBRARY_HINT) {
            $tcltkArgs += "-DTCL_LIBRARY=$env:TCL_LIBRARY_HINT"
            $tcltkArgs += "-DTK_LIBRARY=$env:TK_LIBRARY_HINT"
            $tcltkArgs += "-DTCL_INCLUDE_PATH=$env:TCLTK_INCLUDE_HINT"
            $tcltkArgs += "-DTK_INCLUDE_PATH=$env:TCLTK_INCLUDE_HINT"
          }

          # --- Configure: response files = fix for "The command line is too long" ---
          cmake -S . -B $env:OPENSEES_BUILD -G Ninja `
            -DCMAKE_BUILD_TYPE="${{ matrix.cmake_cfg }}" `
            -DCMAKE_NINJA_FORCE_RESPONSE_FILE=ON `
            -DCMAKE_C_USE_RESPONSE_FILE_FOR_INCLUDES=ON `
            -DCMAKE_CXX_USE_RESPONSE_FILE_FOR_INCLUDES=ON `
            -DCMAKE_Fortran_USE_RESPONSE_FILE_FOR_INCLUDES=ON `
            -DCMAKE_C_USE_RESPONSE_FILE_FOR_OBJECTS=ON `
            -DCMAKE_CXX_USE_RESPONSE_FILE_FOR_OBJECTS=ON `
            -DCMAKE_Fortran_USE_RESPONSE_FILE_FOR_OBJECTS=ON `
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_Fortran_COMPILER="$ifxPath" `
            -DCMAKE_C_FLAGS="${{ matrix.c_flags }}" `
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" `
            -DCMAKE_Fortran_FLAGS="${{ matrix.f_flags }}" `
            -DBLA_VENDOR=Intel10_64lp -DBLA_STATIC=ON -DMKL_LINK=static `
            -DMKL_INTERFACE_FULL=intel_lp64 -DMKL_THREADING=sequential `
            -DMUMPS_DIR="$env:MUMPS_LIBDIR" -DPARALLEL=1 `
            -DSCALAPACK_LIBRARIES="$env:SCALAPACK_LIB;$env:BLACS_LIB" `
            @tcltkArgs
          if ($LASTEXITCODE -ne 0) { Write-Host "ERROR: CMake configure failed"; exit 1 }

          # --- Verify build type + scalapack interface ---
          $btLine = (Select-String -Path "$env:OPENSEES_BUILD\CMakeCache.txt" -Pattern '^CMAKE_BUILD_TYPE:').Line
          Write-Host "Cache says: $btLine"
          if ($btLine -notmatch [regex]::Escape("${{ matrix.cmake_cfg }}")) {
            Write-Host "ERROR: CMAKE_BUILD_TYPE is not ${{ matrix.cmake_cfg }}"
            exit 1
          }
          $scLine = (Select-String -Path "$env:OPENSEES_BUILD\CMakeCache.txt" -Pattern '^SCALAPACK_LIBRARIES:').Line
          Write-Host "Cache says: $scLine"
          if ($scLine -match 'ilp64') {
            Write-Host "ERROR: SCALAPACK_LIBRARIES still ilp64 (must be lp64 to match MUMPS)"
            exit 1
          }
          Write-Host "Configure verified: CFG=${{ matrix.cmake_cfg }}, SCALAPACK=lp64"

      # ============================================================
      # 8. HARD GATE: No Netlib fallback, no ilp64
      # ============================================================
      - name: Verify OpenSees CMake configuration
        shell: pwsh
        run: |
          $cache = Get-Content "$env:OPENSEES_BUILD\CMakeCache.txt" -Raw
          if ($cache -notmatch "mkl_scalapack_lp64\.lib") { Write-Host "ERROR: ScaLAPACK lp64 missing in CMakeCache"; exit 1 }
          if ($cache -notmatch "mkl_blacs_intelmpi_lp64\.lib") { Write-Host "ERROR: BLACS lp64 missing in CMakeCache"; exit 1 }
          if ($cache -match "mkl_scalapack_ilp64|mkl_blacs_intelmpi_ilp64") { Write-Host "ERROR: ilp64 MKL detected in cache"; exit 1 }
          if ($cache -match "openblas|reference_blas|usr/lib|x86_64-linux-gnu") {
            Write-Host "ERROR: generic BLAS/LAPACK fallback detected!"
            exit 1
          }
          Write-Host "HARD GATE PASSED: MKL lp64 + ScaLAPACK + BLACS enforced."

      # ============================================================
      # 9. Build OpenSees (Serial) - log saved for summary
      # ============================================================
      - name: Build OpenSees
        shell: pwsh
        run: |
          cmake --build $env:OPENSEES_BUILD --target OpenSees --parallel 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\build_opensees.log"
          if ($LASTEXITCODE -ne 0) { Write-Host "ERROR: Build OpenSees failed"; exit 1 }

      # ============================================================
      # 10. Build OpenSeesSP (Parallel) - log saved for summary
      # ============================================================
      - name: Build OpenSeesSP
        shell: pwsh
        run: |
          cmake --build $env:OPENSEES_BUILD --target OpenSeesSP --parallel 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\build_openseessp.log"
          if ($LASTEXITCODE -ne 0) { Write-Host "ERROR: Build OpenSeesSP failed"; exit 1 }

      # ============================================================
      # 11. CRITICAL LINK VERIFICATION (build.ninja + rsp)
      # ============================================================
      - name: Verify OpenSeesSP link contains ScaLAPACK and BLACS
        shell: pwsh
        run: |
          $sources = @(Get-Content "$env:OPENSEES_BUILD\build.ninja" -Raw -ErrorAction SilentlyContinue)
          $sources += (Get-ChildItem -Path $env:OPENSEES_BUILD -Recurse -Filter "*.rsp" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Raw })
          $all = $sources -join "`n"
          if ($all -notmatch "mkl_scalapack_lp64\.lib") { Write-Host "ERROR: ScaLAPACK lp64 not in final link"; exit 1 }
          if ($all -notmatch "mkl_blacs_intelmpi_lp64\.lib") { Write-Host "ERROR: BLACS lp64 not in final link"; exit 1 }
          if ($all -match "mkl_scalapack_ilp64\.lib") { Write-Host "ERROR: ilp64 in final link"; exit 1 }
          Write-Host "LINK VERIFICATION PASSED."

      # ============================================================
      # 12. MKL static-link verification (معادل strings لینوکس)
      # ============================================================
      - name: Verify Intel MKL inside OpenSeesSP
        shell: pwsh
        run: |
          findstr /C:"Math Kernel Library" "$env:OPENSEES_BUILD\OpenSeesSP.exe" > "$env:TEMP\mkl_sig.txt" 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "ERROR: MKL signature NOT found -> fallback occurred"; exit 1 }
          Get-Content "$env:TEMP\mkl_sig.txt" | Select-Object -First 5 | ForEach-Object { Write-Host $_ }
          Write-Host "MKL signature verified."

      # ============================================================
      # 13. Runtime smoke test: OpenSees
      # ============================================================
      - name: Runtime test OpenSees
        shell: pwsh
        run: |
          $out = ("puts {OpenSees is working}; exit" | & "$env:OPENSEES_BUILD\OpenSees.exe" | Out-String)
          Write-Host $out
          if ($out -notmatch "OpenSees is working") { Write-Host "ERROR: OpenSees smoke test failed"; exit 1 }

      # ============================================================
      # 14. Runtime smoke test: OpenSeesSP (MPI + MUMPS + Timeout)
      # ============================================================
      - name: Runtime test OpenSeesSP (MPI Timeout Logic)
        shell: pwsh
        run: |
          cd $env:OPENSEES_BUILD
          "system Mumps; puts {OpenSeesSP is working}; exit" | Out-File -Encoding ascii test_mumps.tcl

          $pinfo = New-Object System.Diagnostics.ProcessStartInfo
          $pinfo.FileName = "mpiexec"
          $pinfo.Arguments = "-n 2 .\OpenSeesSP.exe test_mumps.tcl"
          $pinfo.RedirectStandardOutput = $true
          $pinfo.RedirectStandardError = $true
          $pinfo.UseShellExecute = $false
          $pinfo.CreateNoWindow = $true
          $p = New-Object System.Diagnostics.Process
          $p.StartInfo = $pinfo
          $p.Start() | Out-Null
          $exited = $p.WaitForExit(60000)
          $stdout = $p.StandardOutput.ReadToEnd()
          $stderr = $p.StandardError.ReadToEnd()
          if (-not $exited) { Write-Host "Killed by timeout (expected for MPI rank hang)"; $p.Kill() }
          Write-Host "STDOUT: $stdout"
          Write-Host "STDERR: $stderr"
          if ($stdout -notmatch "OpenSeesSP is working") { Write-Host "ERROR: OpenSeesSP smoke test failed"; exit 1 }
          Write-Host "OpenSeesSP + MUMPS smoke test passed."

      # ============================================================
      # 15. Package Binaries + ALL Runtime DLLs
      # ============================================================
      - name: Package Artifacts (Binaries + DLLs)
        shell: pwsh
        run: |
          $artifact_dir = "artifact_${{ matrix.build_type }}"
          New-Item -ItemType Directory -Path $artifact_dir | Out-Null
          Copy-Item "$env:OPENSEES_BUILD\OpenSees.exe" $artifact_dir\
          Copy-Item "$env:OPENSEES_BUILD\OpenSeesSP.exe" $artifact_dir\

          # vcpkg DLLs (از همان root ای که واقعاً نصب کرده‌ایم)
          $vcpkgUsed = $env:VCPKG_USED
          if (-not $vcpkgUsed) { $vcpkgUsed = $env:VCPKG_INSTALLATION_ROOT }
          if ($vcpkgUsed) {
            Copy-Item "$vcpkgUsed\installed\x64-windows\bin\*.dll" $artifact_dir\ -ErrorAction SilentlyContinue
          }
          # Tcl/Tk DLLs
          if ($env:TCLTK_BIN_DIR) {
            Copy-Item "$env:TCLTK_BIN_DIR\*.dll" $artifact_dir\ -ErrorAction SilentlyContinue
          }
          # Intel runtime DLLs (OpenMP / Fortran / MPI)
          $intel_root = "C:\Program Files (x86)\Intel\oneAPI"
          foreach ($dll in @("libiomp5md.dll","libifcoremd.dll","libifportmd.dll","libmmd.dll","svml_dispmd.dll","impi.dll","impicxx.dll")) {
            foreach ($sub in @("compiler","mpi")) {
              $hit = Get-ChildItem -Path (Join-Path $intel_root $sub) -Recurse -Filter $dll -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hit) { Copy-Item $hit.FullName $artifact_dir\ -ErrorAction SilentlyContinue; break }
            }
          }
          Get-ChildItem $artifact_dir | ForEach-Object { Write-Host $_.Name }

      # ============================================================
      # 16. Upload Artifacts
      # ============================================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSees-Windows-${{ matrix.build_type }}-AVX2
          path: artifact_${{ matrix.build_type }}/
          if-no-files-found: error
          compression-level: 6

      # ============================================================
      # 17. Error Summary (فقط وقتی چیزی fail شد) -> تب Summary
      # ============================================================
      - name: Error Summary (only on failure)
        if: failure()
        shell: pwsh
        run: |
          $fence = '```'
          $sum = "# Build Failed - Key Errors`n`n"
          foreach ($log in @("$env:GITHUB_WORKSPACE\build_opensees.log", "$env:GITHUB_WORKSPACE\build_openseessp.log")) {
            if (Test-Path $log) {
              $hits = Get-Content $log | Select-String -Pattern 'FAILED:|error C|error LNK|fatal|too long' | Select-Object -First 25
              if ($hits) {
                $sum += "## $([System.IO.Path]::GetFileName($log))`n" + $fence + "`n"
                $sum += (($hits | ForEach-Object { $_.Line }) -join "`n") + "`n" + $fence + "`n`n"
              }
            }
          }
          $cache = "$env:OPENSEES_BUILD\CMakeCache.txt"
          if (Test-Path $cache) {
            $bt = (Select-String -Path $cache -Pattern '^CMAKE_BUILD_TYPE:').Line
            $sc = (Select-String -Path $cache -Pattern '^SCALAPACK_LIBRARIES:').Line
            $sum += "## CMake Cache`n- $bt`n- $sc`n"
          }
          $sum | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host "Summary written. Check the Summary tab at the top of the run page."
