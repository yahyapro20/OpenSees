# مسیر قرارگیری در ریپو: .github/workflows/build-opensees-windows.yml
# Runner: self-hosted روی سخت‌افزار خودت (چون فلگ‌های MKL/AVX2 مخصوص همین سیستم‌اند)
# پیش‌نیاز روی همون رانر از قبل نصب باشه: VS2022 + oneAPI Base + oneAPI HPC + CMake + Ninja + Git + Python(pip) + VTune

name: Cluadaude ai Build OpenSees Windows (MKL Static)

on:
  workflow_dispatch:
    inputs:
      profile_model_path:
        description: 'مسیر فایل .tcl برای پروفایل خودکار با VTune (اختیاری)'
        required: false
        default: ''
  push:
    branches: [ main ]

env:
  ROOT: C:\ob
  JOBS: 8
  ONEAPI_SETVARS: C:\Program Files (x86)\Intel\oneAPI\setvars.bat

defaults:
  run:
    shell: cmd

jobs:
  build-release:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Prepare root + conan
        run: |
          if not exist %ROOT% mkdir %ROOT%
          where conan >nul 2>nul || pip install conan==1.59.0

      - name: Clone MUMPS + OpenSees
        run: |
          cd /d %ROOT%
          if not exist mumps git clone https://github.com/OpenSees/mumps.git
          if not exist OpenSees git clone https://github.com/OpenSees/OpenSees.git
          cd OpenSees && git pull
          cd /d %ROOT%\mumps && git pull

      - name: Build MUMPS (Release)
        run: |
          call "%ONEAPI_SETVARS%" intel64
          cd /d %ROOT%\mumps
          if not exist build-release mkdir build-release
          cd build-release
          cmake .. -Darith=d -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" -G Ninja
          cmake --build . --config Release --parallel %JOBS%

      - name: Conan install (Release)
        run: |
          cd /d %ROOT%\OpenSees
          if not exist build-release mkdir build-release
          cd build-release
          conan install .. --build missing --settings compiler.runtime="MT"

      - name: Configure OpenSees (Release, MKL static enforced)
        run: |
          call "%ONEAPI_SETVARS%" intel64
          cd /d %ROOT%\OpenSees\build-release
          cmake .. -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" ^
            -DBLA_VENDOR=Intel10_64lp ^
            -DBLA_STATIC=ON ^
            -DMKL_LINK=static ^
            -DMKL_INTERFACE_FULL=intel_lp64 ^
            -DMUMPS_DIR="%ROOT%\mumps\build-release"

      - name: Build OpenSees.exe
        run: |
          call "%ONEAPI_SETVARS%" intel64
          cd /d %ROOT%\OpenSees\build-release
          cmake --build . --config Release --target OpenSees --parallel %JOBS%

      - name: Build OpenSeesSP.exe
        run: |
          call "%ONEAPI_SETVARS%" intel64
          cd /d %ROOT%\OpenSees\build-release
          cmake --build . --config Release --target OpenSeesSP --parallel %JOBS%

      - name: Verify MKL static (hard fail on any fallback)
        run: |
          cd /d %ROOT%\OpenSees\build-release
          findstr /I "mkl_rt netlib openblas" CMakeCache.txt >nul 2>nul && (echo [FATAL] fallback BLAS/LAPACK in CMakeCache & exit /b 1)
          dumpbin /dependents bin\OpenSees.exe   | findstr /I "mkl_rt openblas lapack.dll blas.dll" >nul 2>nul && (echo [FATAL] OpenSees.exe not static & exit /b 1)
          dumpbin /dependents bin\OpenSeesSP.exe | findstr /I "mkl_rt openblas lapack.dll blas.dll" >nul 2>nul && (echo [FATAL] OpenSeesSP.exe not static & exit /b 1)
          echo [OK] MKL static verified for both binaries
          exit /b 0

      - name: Copy OpenMP runtime dll
        run: |
          copy "%ONEAPI_ROOT%\compiler\latest\bin\libiomp5md.dll" %ROOT%\OpenSees\build-release\bin\ >nul 2>nul

      - name: Upload Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opensees-windows-release
          path: |
            C:\ob\OpenSees\build-release\bin\OpenSees.exe
            C:\ob\OpenSees\build-release\bin\OpenSeesSP.exe
            C:\ob\OpenSees\build-release\bin\libiomp5md.dll

  build-profile-sp:
    needs: build-release
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Build MUMPS (Profile, full debug symbols)
        run: |
          call "%ONEAPI_SETVARS%" intel64
          cd /d %ROOT%\mumps
          if not exist build-profile mkdir build-profile
          cd build-profile
          cmake .. -Darith=d -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" -DCMAKE_BUILD_TYPE=RelWithDebInfo -G Ninja
          cmake --build . --config RelWithDebInfo --parallel %JOBS%

      - name: Conan install (Profile)
        run: |
          cd /d %ROOT%\OpenSees
          if not exist build-profile mkdir build-profile
          cd build-profile
          conan install .. --build missing --settings compiler.runtime="MT" --settings build_type=RelWithDebInfo

      - name: Configure OpenSeesSP (Profile, MKL static + full PDB)
        run: |
          call "%ONEAPI_SETVARS%" intel64
          cd /d %ROOT%\OpenSees\build-profile
          cmake .. -G Ninja ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" ^
            -DBLA_VENDOR=Intel10_64lp ^
            -DBLA_STATIC=ON ^
            -DMKL_LINK=static ^
            -DMKL_INTERFACE_FULL=intel_lp64 ^
            -DMUMPS_DIR="%ROOT%\mumps\build-profile" ^
            -DCMAKE_EXE_LINKER_FLAGS="/DEBUG /OPT:REF /OPT:ICF"

      - name: Build OpenSeesSP.exe (Profile)
        run: |
          call "%ONEAPI_SETVARS%" intel64
          cd /d %ROOT%\OpenSees\build-profile
          cmake --build . --config RelWithDebInfo --target OpenSeesSP --parallel %JOBS%

      - name: Verify MKL static (Profile build too)
        run: |
          cd /d %ROOT%\OpenSees\build-profile
          dumpbin /dependents bin\OpenSeesSP.exe | findstr /I "mkl_rt openblas lapack.dll blas.dll" >nul 2>nul && (echo [FATAL] Profile OpenSeesSP.exe not static & exit /b 1)
          echo [OK] Profile build MKL static verified
          exit /b 0

      - name: Copy OpenMP runtime dll
        run: |
          copy "%ONEAPI_ROOT%\compiler\latest\bin\libiomp5md.dll" %ROOT%\OpenSees\build-profile\bin\ >nul 2>nul

      - name: Run VTune hotspots (line-level, ranked by time)
        if: ${{ github.event.inputs.profile_model_path != '' }}
        run: |
          call "%ONEAPI_SETVARS%" intel64
          cd /d %ROOT%\OpenSees\build-profile\bin
          vtune -collect hotspots -knob sampling-mode=hw -result-dir vtune-run -- OpenSeesSP.exe "${{ github.event.inputs.profile_model_path }}"
          vtune -report hotspots -r vtune-run -report-output hotspots.csv -format csv -column-config="Function,Source File,Source Line Number,CPU Time:Self"

      - name: Upload Profile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opensees-windows-profile-sp
          path: |
            C:\ob\OpenSees\build-profile\bin\OpenSeesSP.exe
            C:\ob\OpenSees\build-profile\bin\OpenSeesSP.pdb
            C:\ob\OpenSees\build-profile\bin\libiomp5md.dll
            C:\ob\OpenSees\build-profile\bin\hotspots.csv
          if-no-files-found: ignore
