name: grok-sp

on:
  workflow_dispatch:

jobs:
  build:
    name: OpenSeesSP Parallel (Windows)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      # ---------------------------------------------------------
      # 1. Source
      # ---------------------------------------------------------
      - name: Checkout OpenSees official source
        uses: actions/checkout@v4
        with:
          repository: OpenSees/OpenSees
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. MSVC 2022 (x64 native tools)
      # ---------------------------------------------------------
      - name: Setup MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: 2022

      # ---------------------------------------------------------
      # 3. Intel oneAPI: MKL (BaseKit) + MPI + ifx (HPCKit)
      # ---------------------------------------------------------
      - name: Install Intel oneAPI (MKL + Fortran/ifx + MPI)
        shell: pwsh
        env:
          WINDOWS_BASEKIT_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/7dff44ba-e3af-4448-841c-0d616c8da6e7/w_BaseKit_p_2024.1.0.595_offline.exe
          WINDOWS_BASEKIT_COMPONENTS: intel.oneapi.win.mkl.devel
          WINDOWS_HPCKIT_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/c95a3b26-fc45-496c-833b-df08b10297b9/w_HPCKit_p_2024.1.0.561_offline.exe
          WINDOWS_HPCKIT_COMPONENTS: "intel.oneapi.win.mpi.devel:intel.oneapi.win.ifort-compiler"
        run: |
          $script = @"
          REM SPDX-FileCopyrightText: 2022 Intel Corporation
          set URL=%1
          set COMPONENTS=%2
          curl.exe --output %TEMP%\webimage.exe --url %URL% --retry 5 --retry-delay 5
          start /b /wait %TEMP%\webimage.exe -s -x -f webimage_extracted --log extract.log
          del %TEMP%\webimage.exe
          webimage_extracted\bootstrapper.exe -s --action install --components=%COMPONENTS% --eula=accept -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=1 -p=NEED_VS2022_INTEGRATION=0 --log-dir=.
          set installer_exit_code=%ERRORLEVEL%
          rd /s/q "webimage_extracted"
          exit /b %installer_exit_code%
          "@
          $script | Out-File -Encoding ascii install_oneapi.bat
          cmd /c "install_oneapi.bat $env:WINDOWS_BASEKIT_URL $env:WINDOWS_BASEKIT_COMPONENTS"
          cmd /c "install_oneapi.bat $env:WINDOWS_HPCKIT_URL $env:WINDOWS_HPCKIT_COMPONENTS"

      # ---------------------------------------------------------
      # 4. Python + Conan (for HDF5, TCL, Eigen, ZLIB)
      # ---------------------------------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      # ---------------------------------------------------------
      # 5. MUMPS parallel (d-arith + MKL + Intel MPI)
      # ---------------------------------------------------------
      - name: Build MUMPS (Parallel)
        shell: cmd
        run: |
          git clone https://github.com/OpenSees/mumps.git
          cd mumps
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 mod
          cmake -S . -B build -G Ninja ^
            -Darith=d ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" ^
            -DCMAKE_EXE_LINKER_FLAGS="/link /FORCE:MULTIPLE" ^
            -DCMAKE_SHARED_LINKER_FLAGS="/link /FORCE:MULTIPLE"
          cd build
          cmake --build . --config Release --parallel %NUMBER_OF_PROCESSORS%

      # ---------------------------------------------------------
      # 6. Patch: DistributedSuperLU — resolve `stat` symbol clash
      #    (SuperLUStat_t stat conflicts with POSIX stat on MSVC)
      # ---------------------------------------------------------
      - name: Patch DistributedSuperLU (stat conflict)
        shell: pwsh
        run: |
          $file = "SRC/system_of_eqn/linearSOE/sparseGEN/DistributedSuperLU.cpp"
          if (Test-Path $file) {
            Write-Host "Patching $file ..."
            $content = Get-Content $file -Raw
            $content = $content -replace 'SuperLUStat_t\s+stat\s*;', 'SuperLUStat_t superlu_stat;'
            $content = $content -replace '&stat\b', '&superlu_stat'
            $content = $content -replace '\bstat\.', 'superlu_stat.'
            $content = $content -replace '\bstat,', 'superlu_stat,'
            $content = $content -replace '\(stat\)', '(superlu_stat)'
            Set-Content -Path $file -Value $content -NoNewline
            Write-Host "DistributedSuperLU.cpp patched"
          }

      # ---------------------------------------------------------
      # 7. Patch: GmshRecorder — VLA → std::vector (MSVC has no VLA)
      # ---------------------------------------------------------
      - name: Patch GmshRecorder.cpp (VLA → std::vector for MSVC)
        shell: pwsh
        run: |
          $file = "SRC/recorder/GmshRecorder.cpp"
          if (Test-Path $file) {
            Write-Host "Patching $file ..."
            $content = Get-Content $file -Raw

            # VLA → std::vector
            $content = $content -replace 'int numvertex_proc\[nproc\];', 'std::vector<int> numvertex_proc(nproc);'

            # MPI_Allgather needs .data() for the vector
            $content = $content -replace 'MPI_Allgather\(\s*&numvertex\s*,\s*1\s*,\s*MPI_INT\s*,\s*numvertex_proc\s*,', 'MPI_Allgather(&numvertex, 1, MPI_INT, numvertex_proc.data(),'

            Set-Content -Path $file -Value $content -NoNewline
            Write-Host "GmshRecorder.cpp patched successfully"
          } else {
            Write-Host "WARNING: GmshRecorder.cpp not found"
          }

      # ---------------------------------------------------------
      # 8. Configure + Build OpenSeesSP
      #    Static MKL, static MSVC runtime, AVX2, MUMPS parallel
      # ---------------------------------------------------------
      - name: Configure + Build OpenSeesSP
        shell: cmd
        run: |
          set CMAKE_POLICY_VERSION_MINIMUM=3.5
          conan install . -s arch=x86_64 -s compiler.runtime=static --build=missing -c tools.cmake.cmaketoolchain:generator=Ninja -of build/Release
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 mod
          cmake.exe -S . -B build/Release -G "Ninja" ^
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" ^
            -DCMAKE_Fortran_COMPILER="ifx" ^
            -DBLA_STATIC=ON -DMKL_LINK=static -DMKL_INTERFACE_FULL=intel_lp64 ^
            -DMUMPS_DIR="..\..\mumps\build" ^
            -DCMAKE_CXX_FLAGS_RELEASE="/O2 /arch:AVX2 /GL /DNDEBUG /D_PARALLEL_PROCESSING=1" ^
            -DCMAKE_C_FLAGS_RELEASE="/O2 /arch:AVX2 /GL /DNDEBUG /D_PARALLEL_PROCESSING=1" ^
            -DCMAKE_Fortran_FLAGS_RELEASE="/O2 /arch:AVX2 /DNDEBUG" ^
            -DCMAKE_EXE_LINKER_FLAGS="/FORCE:MULTIPLE /LTCG" ^
            -DCMAKE_SHARED_LINKER_FLAGS="/FORCE:MULTIPLE /LTCG" ^
            -DCMAKE_NINJA_FORCE_RESPONSE_FILE=ON
          cd build/Release
          cmake --build . --config Release --target OpenSeesSP --parallel %NUMBER_OF_PROCESSORS%

      # ---------------------------------------------------------
      # 9. Sanity check + gather Intel runtime DLLs next to exe
      #    (no mpiexec test — MPI runtime quirks on CI runners
      #     make that unreliable; end-user runs it on their own machine)
      # ---------------------------------------------------------
      - name: Verify + Collect DLLs
        shell: pwsh
        run: |
          $exePath = "build/Release/OpenSeesSP.exe"
          if (-not (Test-Path $exePath)) {
            Write-Host "OpenSeesSP.exe not found"
            exit 1
          }
          Write-Host "OpenSeesSP.exe size: $([math]::Round((Get-Item $exePath).Length / 1MB, 2)) MB"

          # Confirm MKL was actually linked in
          $content = [System.IO.File]::ReadAllText($exePath, [System.Text.Encoding]::GetEncoding(28591))
          if ($content.Contains("Math Kernel Library")) {
            Write-Host "MKL found in binary"
          } else {
            Write-Host "MKL NOT found"
            exit 1
          }

          # Copy Intel runtime DLLs so the exe is self-contained
          $dllDirs = @(
            "C:\Program Files (x86)\Intel\oneAPI\compiler\latest\bin",
            "C:\Program Files (x86)\Intel\oneAPI\mpi\latest\bin",
            "C:\Program Files (x86)\Intel\oneAPI\mkl\latest\bin"
          )

          foreach ($dir in $dllDirs) {
            if (Test-Path $dir) {
              Get-ChildItem "$dir\*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
                Copy-Item $_.FullName "build\Release\" -Force -ErrorAction SilentlyContinue
              }
              Write-Host "Copied DLLs from $dir"
            } else {
              Write-Host "WARN: $dir does not exist"
            }
          }
          Write-Host "OK"

      # ---------------------------------------------------------
      # 10. Package artifact (exe + DLLs)
      # ---------------------------------------------------------
      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Copy-Item build/Release/OpenSeesSP.exe artifacts/release/
          Get-ChildItem build/Release/*.dll -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName artifacts/release/
          }

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-OpenSeesSP-windows
          path: artifacts/
          retention-days: 30
