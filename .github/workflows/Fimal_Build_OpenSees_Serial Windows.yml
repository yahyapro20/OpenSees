name: Final Build OpenSees Serial Windows (Release + Profile)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENSEES_BUILD: ${{ github.workspace }}/build

jobs:
  build-windows-serial:
    name: OpenSees ${{ matrix.name }} / Windows MSVC + oneAPI / Serial
    runs-on: windows-2022
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            cfg: Release

          - name: Profile
            cfg: RelWithDebInfo

    env:
      CFG: ${{ matrix.cfg }}

    steps:

      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout OpenSees
        uses: actions/checkout@v4
        with:
          repository: yahyapro20/OpenSees
          ref: master
          fetch-depth: 1


      # ============================================================
      # vcpkg dependencies
      #
      # Serial OpenSees dependencies only.
      # NO MPI
      # NO MUMPS
      # NO ScaLAPACK
      # ============================================================
      - name: Setup vcpkg and install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT

          if (-not $vcpkgRoot -or -not (Test-Path (Join-Path $vcpkgRoot "vcpkg.exe"))) {
            $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg"

            cmd /c "git clone --depth 1 https://github.com/microsoft/vcpkg.git `"$vcpkgRoot`" 2>&1"

            if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: vcpkg clone failed"
              exit 1
            }

            cmd /c "`"$vcpkgRoot\bootstrap-vcpkg.bat`" -disableMetrics 2>&1"

            if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: vcpkg bootstrap failed"
              exit 1
            }
          }

          $vcpkgExe = Join-Path $vcpkgRoot "vcpkg.exe"

          Add-Content -Path $env:GITHUB_ENV `
            -Value "VCPKG_ROOT=$($vcpkgRoot -replace '\\','/')"

          & $vcpkgExe version

          foreach ($pkg in @(
            "zlib:x64-windows",
            "eigen3:x64-windows",
            "hdf5[core,hl,szip,zlib]:x64-windows"
          )) {
            Write-Host ">>> Installing: $pkg"

            & $vcpkgExe install $pkg 2>&1 |
              ForEach-Object { Write-Host $_ }

            if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: vcpkg install $pkg failed"
              exit 1
            }
          }

          $inst = Join-Path $vcpkgRoot "installed\x64-windows"

          if (-not (Test-Path (Join-Path $inst "include\hdf5_hl.h"))) {
            Write-Host "ERROR: hdf5_hl.h missing"
            exit 1
          }

          Write-Host "Serial vcpkg dependencies installed successfully."


      # ============================================================
      # Build Tcl/Tk 8.6
      # ============================================================
      - name: Build Tcl/Tk 8.6 from source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vcvars = & $vswhere `
            -latest `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find "VC\Auxiliary\Build\vcvars64.bat" |
            Select-Object -First 1

          if (-not $vcvars) {
            Write-Host "ERROR: vcvars64.bat not found"
            exit 1
          }

          $tcltkDir = "C:\tcltk"

          if (Test-Path C:\srctcl) {
            Remove-Item -Recurse -Force C:\srctcl
          }

          if (Test-Path C:\srctk) {
            Remove-Item -Recurse -Force C:\srctk
          }

          if (Test-Path $tcltkDir) {
            Remove-Item -Recurse -Force $tcltkDir
          }

          cmd /c `
            "git clone --depth 1 --branch core-8-6-branch https://github.com/tcltk/tcl.git C:\srctcl 2>&1"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Tcl clone failed"
            exit 1
          }

          cmd /c `
            "git clone --depth 1 --branch core-8-6-branch https://github.com/tcltk/tk.git C:\srctk 2>&1"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Tk clone failed"
            exit 1
          }

          cmd /c `
            "call `"$vcvars`" && cd /d C:\srctcl\win && nmake -f makefile.vc release OPTS=static 2>&1"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Tcl build failed"
            exit 1
          }

          cmd /c `
            "call `"$vcvars`" && cd /d C:\srctk\win && nmake -f makefile.vc release OPTS=static 2>&1"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Tk build failed"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path $tcltkDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$tcltkDir\bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$tcltkDir\include" | Out-Null
          New-Item -ItemType Directory -Force -Path "$tcltkDir\lib" | Out-Null

          Copy-Item C:\srctcl\win\Release\*.dll "$tcltkDir\bin\" -Force
          Copy-Item C:\srctk\win\Release\*.dll "$tcltkDir\bin\" -Force

          Copy-Item C:\srctcl\generic\*.h "$tcltkDir\include\" -Force
          Copy-Item C:\srctk\generic\*.h "$tcltkDir\include\" -Force

          Copy-Item C:\srctcl\win\Release\*.lib "$tcltkDir\lib\" -Force
          Copy-Item C:\srctk\win\Release\*.lib "$tcltkDir\lib\" -Force

          $tclLib = Get-ChildItem "$tcltkDir\lib" -Filter "tcl*.lib" |
            Select-Object -First 1

          $tkLib = Get-ChildItem "$tcltkDir\lib" -Filter "tk*.lib" |
            Select-Object -First 1

          if (-not $tclLib) {
            Write-Host "ERROR: Tcl library not found"
            exit 1
          }

          if (-not $tkLib) {
            Write-Host "ERROR: Tk library not found"
            exit 1
          }

          Add-Content $env:GITHUB_ENV `
            "TCLTK_INCLUDE_HINT=$($tcltkDir -replace '\\','/')/include"

          Add-Content $env:GITHUB_ENV `
            "TCL_LIBRARY_HINT=$($tclLib.FullName -replace '\\','/')"

          Add-Content $env:GITHUB_ENV `
            "TK_LIBRARY_HINT=$($tkLib.FullName -replace '\\','/')"

          Add-Content $env:GITHUB_ENV `
            "TCLTK_BIN_DIR=$($tcltkDir -replace '\\','/')/bin"

          Write-Host "Tcl/Tk 8.6 built successfully."


      # ============================================================
      # Intel oneAPI
      #
      # IMPORTANT:
      # Only MKL + Intel Fortran compiler.
      #
      # NO Intel MPI component.
      # ============================================================
      - name: Download Intel oneAPI 2026.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $workdir = $env:GITHUB_WORKSPACE

          $url = "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/4144bec3-82ce-4672-bd71-5c93a79cd5e7/intel-oneapi-toolkit-2026.1.0.191_offline.exe"

          curl.exe `
            --output "$workdir\webimage.exe" `
            --url $url `
            --retry 5 `
            --retry-delay 5

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: oneAPI download failed"
            exit 1
          }

          cmd /c `
            "cd /d $workdir && start /b /wait webimage.exe -s -x -f webimage_extracted --log extract.log"

          if (-not (Test-Path "$workdir\webimage_extracted\bootstrapper.exe")) {
            Write-Host "ERROR: oneAPI extraction failed"
            exit 1
          }


      - name: Install Intel oneAPI components
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $workdir = $env:GITHUB_WORKSPACE

          # IMPORTANT:
          # No Intel MPI.
          #
          # Required:
          #   MKL
          #   Intel Fortran compiler (ifx)
          #
          $components = "intel.oneapi.win.mkl.devel:intel.oneapi.win.ifort-compiler"

          cmd /c `
            "cd /d $workdir && webimage_extracted\bootstrapper.exe -s --action install --components=$components --eula=accept -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0 --log-dir=$workdir 2>&1"

          if (-not (Test-Path "C:\Program Files (x86)\Intel\oneAPI\setvars.bat")) {
            Write-Host "ERROR: setvars.bat not found"
            exit 1
          }


      - name: Upload oneAPI install logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oneapi-install-logs-${{ matrix.name }}-serial
          path: |
            extract.log
            bootstrapper*


      # ============================================================
      # Activate oneAPI
      #
      # NO mpiexec check.
      # ============================================================
      - name: Activate Intel oneAPI environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $envVars = cmd /c `
            "`"C:\Program Files (x86)\Intel\oneAPI\setvars.bat`" intel64 && set"

          foreach ($line in $envVars) {
            if ($line -match "^(.*?)=(.*)$") {
              [System.Environment]::SetEnvironmentVariable(
                $matches[1],
                $matches[2],
                "Process"
              )

              Add-Content `
                -Path $env:GITHUB_ENV `
                -Value "$($matches[1])=$($matches[2])"
            }
          }

          ifx --version

          Write-Host "Intel oneAPI serial environment activated."


      # ============================================================
      # Configure OpenSees
      #
      # STRICT SERIAL CONFIGURATION
      #
      # NO:
      #   MPI
      #   MUMPS
      #   ScaLAPACK
      #   BLACS
      #   PARALLEL=1
      # ============================================================
      - name: Configure OpenSees Serial
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          if (Test-Path $env:OPENSEES_BUILD) {
            Remove-Item -Recurse -Force $env:OPENSEES_BUILD
          }

          New-Item `
            -ItemType Directory `
            -Path $env:OPENSEES_BUILD |
            Out-Null

          $cands = @(
            $env:VCPKG_ROOT,
            $env:VCPKG_INSTALLATION_ROOT,
            "C:/vcpkg"
          )

          $toolchain = $null
          $vcpkgRootUsed = $null

          foreach ($c in $cands) {
            if ($c -and (Test-Path "$c/installed/x64-windows/include/hdf5.h")) {
              $toolchain = "$c/scripts/buildsystems/vcpkg.cmake"
              $vcpkgRootUsed = $c
              break
            }
          }

          if (-not $toolchain) {
            Write-Host "ERROR: no vcpkg root with installed packages found"
            exit 1
          }

          Write-Host "Using vcpkg toolchain: $toolchain"

          $vcpkgInc = "$vcpkgRootUsed/installed/x64-windows/include"
          $vcpkgLib = "$vcpkgRootUsed/installed/x64-windows/lib"

          if (-not (Test-Path "$vcpkgInc/hdf5_hl.h")) {
            Write-Host "ERROR: hdf5_hl.h missing"
            exit 1
          }

          $hdf5hl = "$vcpkgLib/hdf5_hl.lib"

          if (-not (Test-Path $hdf5hl)) {
            $hdf5hl = (
              Get-ChildItem $vcpkgLib -Filter "hdf5_hl*.lib" |
              Select-Object -First 1
            ).FullName
          }

          if (-not $hdf5hl -or -not (Test-Path $hdf5hl)) {
            Write-Host "ERROR: hdf5_hl.lib missing"
            exit 1
          }

          $ifxPath = (
            Get-Command ifx -ErrorAction SilentlyContinue
          ).Source

          if (-not $ifxPath) {
            $ifxPath = Get-ChildItem `
              -Path "C:\Program Files (x86)\Intel\oneAPI" `
              -Recurse `
              -Filter "ifx.exe" `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $ifxPath) {
            Write-Host "ERROR: ifx.exe not found"
            exit 1
          }

          $ifxPath = $ifxPath -replace '\\','/'

          $cfg = $env:CFG

          if (-not $cfg) {
            $cfg = "Release"
          }

          # ========================================================
          # Release
          #
          # Optimized execution build.
          # ========================================================
          if ($cfg -eq "Release") {

            $c_flags = `
              "/MD /O2 /Ob2 /arch:AVX2 /DNDEBUG /DWIN32 /D_WINDOWS /W3 /bigobj /D_CRT_SECURE_NO_WARNINGS /D_SCL_SECURE_NO_WARNINGS"

            $cxx_flags = `
              "/MD /O2 /Ob2 /arch:AVX2 /DNDEBUG /DWIN32 /D_WINDOWS /W3 /GR /EHsc /bigobj /D_CRT_SECURE_NO_WARNINGS /D_SCL_SECURE_NO_WARNINGS"

            $f_flags = `
              "/MD /O2 /arch:AVX2"

          }

          # ========================================================
          # Profile
          #
          # Debug symbols + profiling-friendly optimization.
          # ========================================================
          else {

            $c_flags = `
              "/MD /Zi /O2 /Ob1 /Oy- /arch:AVX2 /DNDEBUG /DWIN32 /D_WINDOWS /W3 /bigobj /D_CRT_SECURE_NO_WARNINGS /D_SCL_SECURE_NO_WARNINGS"

            $cxx_flags = `
              "/MD /Zi /O2 /Ob1 /Oy- /arch:AVX2 /DNDEBUG /DWIN32 /D_WINDOWS /W3 /GR /EHsc /bigobj /D_CRT_SECURE_NO_WARNINGS /D_SCL_SECURE_NO_WARNINGS"

            $f_flags = `
              "/MD /Zi /O2 /arch:AVX2"
          }

          $c_flags += " /I`"$vcpkgInc`""
          $cxx_flags += " /I`"$vcpkgInc`""

          # --------------------------------------------------------
          # Tcl/Tk
          # --------------------------------------------------------
          $tcltkArgs = @()

          if ($env:TCL_LIBRARY_HINT) {

            $tcltkArgs += "-DTCL_LIBRARY=$env:TCL_LIBRARY_HINT"
            $tcltkArgs += "-DTK_LIBRARY=$env:TK_LIBRARY_HINT"
            $tcltkArgs += "-DTCL_INCLUDE_PATH=$env:TCLTK_INCLUDE_HINT"
            $tcltkArgs += "-DTK_INCLUDE_PATH=$env:TCLTK_INCLUDE_HINT"

          }
          else {
            Write-Host "ERROR: Tcl/Tk hints are missing"
            exit 1
          }

          # --------------------------------------------------------
          # CMake
          #
          # MPI is explicitly disabled.
          #
          # There is:
          #   no MUMPS_DIR
          #   no ScaLAPACK
          #   no BLACS
          #   no MPI
          # --------------------------------------------------------
          cmake -S . -B $env:OPENSEES_BUILD -G Ninja `
            -DCMAKE_BUILD_TYPE="$cfg" `
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF `
            -DCMAKE_NINJA_FORCE_RESPONSE_FILE=ON `
            -DCMAKE_Fortran_USE_RESPONSE_FILE_FOR_INCLUDES=ON `
            -DCMAKE_C_USE_RESPONSE_FILE_FOR_INCLUDES=ON `
            -DCMAKE_CXX_USE_RESPONSE_FILE_FOR_INCLUDES=ON `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreadedDLL" `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_Fortran_COMPILER="$ifxPath" `
            -DCMAKE_C_FLAGS="$c_flags" `
            -DCMAKE_CXX_FLAGS="$cxx_flags" `
            -DCMAKE_Fortran_FLAGS="$f_flags" `
            -DCMAKE_EXE_LINKER_FLAGS="`"$hdf5hl`"" `
            -DHDF5_INCLUDE_DIRS="$vcpkgInc" `
            -DBLA_VENDOR=Intel10_64lp `
            -DBLA_STATIC=ON `
            -DMKL_LINK=static `
            -DMKL_INTERFACE_FULL=intel_lp64 `
            -DMKL_THREADING=sequential `
            -DCMAKE_DISABLE_FIND_PACKAGE_MPI=TRUE `
            @tcltkArgs

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: CMake configure failed"
            exit 1
          }

          Write-Host "Serial CMake configure completed."


      # ============================================================
      # HARD GATE
      #
      # Verify that parallel dependencies did NOT enter the build.
      # ============================================================
      - name: HARD GATE verify strictly serial configuration
        shell: pwsh
        run: |
          $cachePath = "$env:OPENSEES_BUILD\CMakeCache.txt"

          if (-not (Test-Path $cachePath)) {
            Write-Host "ERROR: CMakeCache.txt missing"
            exit 1
          }

          $cache = Get-Content $cachePath -Raw

          # Tcl 9 must not leak in.
          if ($cache -match "tcl9|tk9") {
            Write-Host "ERROR: Tcl 9 leaked into build"
            exit 1
          }

          if ($cache -notmatch "tcl86t\.lib") {
            Write-Host "ERROR: Tcl 8.6 not selected"
            exit 1
          }

          # --------------------------------------------------------
          # MPI must not be found.
          # --------------------------------------------------------
          if ($cache -match "MPI_C_FOUND.*TRUE|MPI_CXX_FOUND.*TRUE|MPI_Fortran_FOUND.*TRUE") {
            Write-Host "ERROR: MPI was detected in the serial build"
            exit 1
          }

          if ($cache -match "MPI_C_LIBRARIES:|MPI_CXX_LIBRARIES:|MPI_Fortran_LIBRARIES:") {
            Write-Host "ERROR: MPI libraries entered the serial cache"
            exit 1
          }

          # --------------------------------------------------------
          # MUMPS must not be configured.
          # --------------------------------------------------------
          if ($cache -match "MUMPS_DIR|MUMPS_ROOT|dmumps|mumps_common|mkl_mumps") {
            Write-Host "ERROR: MUMPS configuration leaked into serial build"
            exit 1
          }

          # --------------------------------------------------------
          # ScaLAPACK / BLACS must not be configured.
          # --------------------------------------------------------
          if ($cache -match "SCALAPACK|ScaLAPACK|BLACS|mkl_scalapack|mkl_blacs") {
            Write-Host "ERROR: ScaLAPACK/BLACS configuration leaked into serial build"
            exit 1
          }

          # --------------------------------------------------------
          # PARALLEL option must not be enabled.
          # If present, it must not be TRUE/1.
          # --------------------------------------------------------
          if ($cache -match "(?im)^PARALLEL:.*=(TRUE|ON|1)$") {
            Write-Host "ERROR: PARALLEL is enabled"
            exit 1
          }

          Write-Host "================================================"
          Write-Host "STRICT SERIAL CONFIGURATION VERIFIED"
          Write-Host "MPI        : OFF / NOT FOUND"
          Write-Host "MUMPS      : NOT CONFIGURED"
          Write-Host "ScaLAPACK  : NOT CONFIGURED"
          Write-Host "BLACS      : NOT CONFIGURED"
          Write-Host "PARALLEL   : NOT ENABLED"
          Write-Host "================================================"


      # ============================================================
      # Build OpenSees
      # ============================================================
      - name: Build OpenSees
        shell: pwsh
        run: |
          cmake --build $env:OPENSEES_BUILD `
            --target OpenSees `
            --parallel 4 2>&1 |
            Tee-Object `
              -FilePath "$env:GITHUB_WORKSPACE\build_opensees.log"

          if ($LASTEXITCODE -ne 0) {
            exit 1
          }


      # ============================================================
      # Stage runtime DLLs
      #
      # NO MPI DLLs.
      # ============================================================
      - name: Stage runtime DLLs
        shell: pwsh
        run: |

          if ($env:TCLTK_BIN_DIR) {
            Copy-Item `
              "
